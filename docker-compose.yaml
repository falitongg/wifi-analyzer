services:
    flask:
        build: .
        ports:
            - "5000:5000"
        env_file:
            - app/.env
        volumes:
            - ./app/db/telemetry.db:/app/db/telemetry.db
        depends_on:
            - mosquitto
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
            interval: 60s
            timeout: 20s
            retries: 3
            
        
    mosquitto:
        image: eclipse-mosquitto
        ports:
            - "1883:1883"
        volumes:
            - ./mosquitto/config:/mosquitto/config